<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify OAuth Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Loading State -->
      <div id="loading" class="loading-state">
        <div class="loading-text">Loading...</div>
      </div>

      <!-- Error State -->
      <div id="error" class="error-state" style="display: none;">
        <div class="error-title">Oops!</div>
        <div class="error-message">Something went wrong</div>
        <div id="error-details" class="error-sub-message"></div>
      </div>

      <!-- Main Content -->
      <div id="app" class="main-card-wrapper" style="display: none;">
        <img 
          src="https://storage.googleapis.com/pr-newsroom-wp/1/2018/11/Spotify_Logo_CMYK_Green.png" 
          alt="Spotify Logo" 
          class="auth0-logo" style="height:48px;object-fit:contain;"
        />
        <h1 class="main-title">Spotify OAuth Demo</h1>
        
        <!-- Logged Out State -->
        <div id="logged-out" class="action-card">
          <p class="action-text">Get started by signing in to your account</p>
          <button id="login-btn" class="button login">Log In</button>
        </div>

        <!-- Logged In State -->
        <div id="logged-in" class="logged-in-section" style="display: none;">

          <!-- Profile Popup Modal -->
          <div id="profile-modal" class="modal-overlay">
            <div class="modal-card">
              <button id="modal-close-btn" class="modal-close" title="Close">&times;</button>
              <h2 class="profile-section-title">Your Profile</h2>
              <div id="profile" class="profile-card"></div>
            </div>
          </div>

          <!-- Main content: Top Tracks & Artists (visible after closing popup) -->
          <div id="lists-content" class="lists-content" style="display: none;">
            <div class="lists-header">
              <img id="profile-avatar" class="header-avatar" src="" alt="Profile" title="Show Profile" />
              <button id="logout-btn" class="button logout">Log Out</button>
            </div>
            <div class="lists-layout">
              <div class="list-column">
                <h3 class="list-title">Top Tracks</h3>
                <div id="top-tracks"></div>
              </div>
              <div class="list-column">
                <h3 class="list-title">Top Artists</h3>
                <div id="top-artists"></div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
